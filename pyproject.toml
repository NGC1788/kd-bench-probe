[project]
name = "kd-bench-probe"
version = "0.2.0"
description = "Label probe for MaskedKD on the KSHS x AIM Lab benchmark"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1",          # same as the benchmark reference runs
  "torchvision==0.20.1",
  "numpy==1.26.4",
  "pillow==11.0.0",
  "pycocotools>=2.0.7,<3", # COCO single preparation (benchmark script)
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
